name: Ошибка
description: Неверный разбор, исключение или падение
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Что происходит
      description: Что вы ожидали и что получили
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Предложение или минимальный код, на которых проявляется ошибка, и полный traceback, если он есть
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия ruSyntax
      description: "Вывод `rusyntax -V`: версии ruSyntax, anySeg и ruMorph"
      placeholder: "rusyntax 0.2.0 (anyseg 0.5.0, rumorph 0.7.0)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python и ОС
      placeholder: "Python 3.12, Ubuntu 24.04"
    validations:
      required: true
