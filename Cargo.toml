[workspace]
members = ["crates/rusyntax", "crates/rusyntax-py"]
resolver = "3"

[workspace.package]
version = "0.2.0-dev.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Шкарин Сергей <kouki.sergey@gmail.com>"]
repository = "https://github.com/SergeyShk/ruSyntax"

[profile.release]
lto = "fat"
codegen-units = 1

# Тест сверки разбирает файл настоящей моделью: без оптимизаций это минута вместо секунды
[profile.test]
opt-level = 3
